#  GitHub Action for edk2 redfish client Submodule updates in PFO/amd-edk2-collection.
# *************************************************************************************

name: 'edk2 redfish client - Submodule Update'

on:
  push:
    branches:
     - main
     - master
     - VenicePI_SP7_*
     - WeeklyBIOSs/*
     - Sandbox**

jobs:
  edk2-redfish-submodule:
    uses: PFO/ivv-workflows/.github/workflows/edk2-submodule-updater.yml@main
    with:
      superProjectRepo: PFO/amd-edk2-collection
      superProjectBranch: ${{ github.ref_name }}
      submodulePath: edk2-redfish-client
    secrets:
      PAT_TOKEN: ${{ secrets.IVV_PAT_TOKEN }}
